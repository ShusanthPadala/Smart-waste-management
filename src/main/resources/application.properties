server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:smartwaste
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA/Hibernate configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Custom Application Properties
# Fill Level Thresholds (percentages)
app.threshold.urgent=90.0

# Priority Time Thresholds (hours)
app.threshold.urgent-hours=8.0
app.threshold.soon-hours=24.0

# Sustainability Configurations
app.sustainability.vehicle-fuel-efficiency-km-per-litre=4.5
app.sustainability.co2-emission-factor-kg-per-litre=2.68
app.sustainability.vehicle-capacity=100

# Smart Waste App Configuration
smartwaste.simulation.enabled=true
smartwaste.simulation.interval-hours=4
smartwaste.simulation.history-days=7

spring.jackson.serialization.write-dates-as-timestamps=false
