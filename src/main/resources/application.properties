# Hosts such as Render set PORT; 8080 locally.
server.port=${PORT:8080}
server.compression.enabled=true

# H2 Database configuration (in-memory; the demo district is rebuilt on every start)
spring.datasource.url=jdbc:h2:mem:smartwaste
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA/Hibernate configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

# Prediction thresholds
app.threshold.urgent=90.0
app.threshold.urgent-hours=8.0
app.threshold.soon-hours=24.0

# District shown on start-up (changeable at runtime from the Settings page)
app.district.name=Visakhapatnam
# Depot - all routes start and end here
app.depot.latitude=17.7345
app.depot.longitude=83.2985
# Demo dataset loaded on start-up: visakhapatnam or hyderabad
smartwaste.demo.city=visakhapatnam

# Sustainability model
app.sustainability.vehicle-fuel-efficiency-km-per-litre=4.5
app.sustainability.co2-emission-factor-kg-per-litre=2.68
app.sustainability.vehicle-capacity=100
app.sustainability.average-speed-kmh=25
app.sustainability.service-minutes-per-stop=3
app.sustainability.co2-absorbed-per-tree-kg-per-year=21

# Simulation
# speed: simulated seconds per real second (60 = one simulated hour per real minute)
smartwaste.simulation.enabled=true
smartwaste.simulation.speed=60
smartwaste.simulation.tick-ms=2000
smartwaste.simulation.reading-interval-minutes=60
smartwaste.simulation.history-days=7
smartwaste.simulation.retention-days=14
smartwaste.simulation.autopilot=false

# API docs at /swagger-ui.html, health at /actuator/health
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
management.endpoints.web.exposure.include=health,info

spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.async.request-timeout=-1
